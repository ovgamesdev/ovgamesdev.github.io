<style>
  :root{
    --paper:#f2f3ec; --paper-2:#e9ebe0; --ink:#22301f; --ink-soft:#5a6653;
    --moss:#3f5738; --moss-deep:#2b3d26; --sage:#8fa07f; --line:#d5d8c9;
    --plum:#7a4a5c; --amber:#b6802f; --ok:#3f7a4e; --ok-bg:#e3ede0; --white:#fffefb;
    --shadow: 0 1px 2px rgba(34,48,31,.06), 0 6px 20px rgba(34,48,31,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0;}

  .topbar{ display:flex; align-items:center; gap:12px; padding:12px 22px; background:var(--moss-deep); color:var(--paper); }
  .topbar .leaf{ width:20px; height:20px; flex:none; }
  .topbar h1{ font-size:17px; color:var(--white); }
  .topbar .sub{ font-size:11.5px; color:#c7d2bf; margin-top:1px; }

  .sectionbar{
    display:flex; align-items:center; gap:12px; padding:10px 22px;
    background:var(--white); border-bottom:1px solid var(--line);
    flex-wrap:wrap; position:sticky; top:0; z-index:20; box-shadow:var(--shadow);
  }
  .tabs{ display:flex; gap:6px; }
  .tab-btn{
    appearance:none; border:1px solid var(--line); background:var(--paper);
    color:var(--ink-soft); font-family:inherit; font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .tab-btn .badge{ font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:500; color:var(--ink-soft); background:rgba(0,0,0,.05); padding:1px 6px; border-radius:999px; }
  .tab-btn.active{ background:var(--moss); border-color:var(--moss); color:#fff; }
  .tab-btn.active .badge{ background:rgba(255,255,255,.2); color:#fff; }
  .sb-spacer{ flex:1; }

  .btn{
    appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:600; font-size:13.5px;
    padding:9px 16px; border-radius:999px; display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, background .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--amber); color:#241a08; }
  .btn-primary:hover{ background:#c68f3c; }
  .btn-outline{ background:transparent; color:var(--moss-deep); border:1px solid var(--line); }
  .btn-outline:hover{ background:var(--paper-2); }
  .btn-sm{ padding:7px 13px; font-size:12.5px; }

  .progress-pill{ display:flex; flex-direction:column; gap:1px; background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:6px 14px; font-size:11.5px; color:var(--ink-soft); }
  .progress-pill b{ font-family:'JetBrains Mono',monospace; color:var(--moss-deep); font-size:13px; }

  .landing-wrap{ display:none; }
  .landing-wrap.show{ display:block; }
  .landing{ max-width:640px; margin:36px auto; padding:0 20px; }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:28px; }
  .card h2{ font-size:22px; color:var(--moss-deep); margin-bottom:8px; }
  .card p{ line-height:1.6; color:var(--ink-soft); font-size:14px; }
  .steps{ list-style:none; margin:18px 0; padding:0; display:grid; gap:10px; }
  .steps li{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.5; }
  .steps .num{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--ok-bg); color:var(--moss); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; }

  .dropzone{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:18px; border:1.5px dashed var(--sage); border-radius:12px; padding:26px; text-align:center; background:var(--paper-2); cursor:pointer; }
  .dropzone:hover, .dropzone.drag{ background:#e2e6d5; border-color:var(--moss); }
  .dropzone input{ display:none; }
  .dropzone .dz-title{ font-weight:600; color:var(--moss-deep); font-size:14px; }
  .dropzone .dz-sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .triple-upload{ margin-top:18px; display:grid; gap:10px; }
  .file-slot{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--paper-2); }
  .file-slot .fs-lang{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--moss-deep); width:34px; flex:none; }
  .file-slot .fs-req{ font-size:10.5px; color:var(--plum); font-weight:700; }
  .file-slot .fs-name{ flex:1; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-slot label.pick{ font-size:12px; font-weight:600; color:var(--moss); cursor:pointer; padding:5px 10px; border:1px solid var(--sage); border-radius:8px; }
  .file-slot input{ display:none; }

  .fileerr{ color:#a13a3a; font-size:13px; margin-top:12px; }

  .app{ display:none; }
  .app.active{ display:flex; height:calc(100vh - 106px); }
  .sidebar{ width:330px; flex:none; border-right:1px solid var(--line); background:var(--white); display:flex; flex-direction:column; }
  .sidebar-controls{ padding:12px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  .search-wrap{ position:relative; }
  .search-wrap input{ width:100%; padding:9px 12px 9px 30px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:inherit; background:var(--paper); }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5; }
  select{ width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:12.5px; font-family:inherit; background:var(--paper); color:var(--ink); }
  .toggle-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); }
  .toggle-row input{ accent-color:var(--moss); }
  .sidebar-list{ flex:1; overflow-y:auto; }
  .prod-item{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid #eef0e6; cursor:pointer; font-size:13px; }
  .prod-item:hover{ background:var(--paper-2); }
  .prod-item.active{ background:var(--ok-bg); }
  .prod-dot{ flex:none; width:9px; height:9px; border-radius:50%; background:#d8ccb4; }
  .prod-dot.done{ background:var(--ok); }
  .prod-dot.partial{ background:var(--amber); }
  .prod-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prod-id{ font-size:10.5px; color:#9aa392; font-family:'JetBrains Mono',monospace; }
  .sidebar-count{ padding:9px 14px; font-size:11px; color:var(--ink-soft); border-top:1px solid var(--line); }

  .main{ flex:1; overflow-y:auto; }
  .main-inner{ max-width:760px; margin:0 auto; padding:26px 26px 90px; }
  .empty-state{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-soft); font-size:14px; }

  .prod-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:4px; }
  .prod-head h2{ font-size:21px; color:var(--moss-deep); }
  .prod-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .prod-meta span{ margin-right:14px; }
  .nav-btns{ display:flex; gap:6px; flex:none; flex-wrap:wrap; justify-content:flex-end;}

  .field-block{ margin-top:20px; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px 18px; transition:border-color .15s ease, background .15s ease; }
  .field-block.is-reviewed{ border-color:var(--ok); background:linear-gradient(180deg, var(--ok-bg), var(--white) 70px); }
  .field-block h3{ font-size:13.5px; color:var(--moss-deep); margin-bottom:2px; }
  .field-block .field-hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; }
  textarea.ru-edit{ background:var(--paper-2); }
  textarea.ru-edit:focus{ background:var(--white); }
  .lang-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:11px; }
  .lang-grid.single{ grid-template-columns:1fr; }
  .lang-col label{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:5px; }
  textarea{ width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13px; color:var(--ink); resize:vertical; min-height:38px; background:var(--white); line-height:1.5; }
  textarea:focus{ outline:none; border-color:var(--sage); box-shadow:0 0 0 3px rgba(143,160,127,.18); }
  textarea.big{ min-height:100px; }
  textarea:disabled{ background:#f4f4ef; color:#aab0a2; }

  .reviewed-row{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .reviewed-row input{ width:16px; height:16px; accent-color:var(--ok); }
  .field-block.is-reviewed .reviewed-row{ color:var(--ok); }

  .subhead{ margin-top:24px; margin-bottom:-8px; font-size:11.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--plum); }

  .save-indicator{ position:fixed; right:22px; bottom:22px; z-index:30; background:var(--moss-deep); color:var(--white); font-size:12px; padding:8px 14px; border-radius:999px; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease; pointer-events:none; }
  .save-indicator.show{ opacity:1; transform:translateY(0); }
  .save-indicator .dot{ width:7px; height:7px; border-radius:50%; background:var(--sage); }

  .bottom-nav{ position:sticky; bottom:0; background:linear-gradient(0deg, var(--paper) 60%, transparent); padding:18px 0 4px; display:flex; justify-content:space-between; gap:10px; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#d3d6c6; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 860px){
    .app.active{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; max-height:260px; }
    .lang-grid{ grid-template-columns:1fr; }
    .sectionbar{ position:static; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var LOCAL_PREFIX = "botanika_translate::";
  function localStorageAvailable(){
    try { var k = "__t__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  var useNativeStorage = (typeof window.storage !== "undefined");
  var storageOk = useNativeStorage || localStorageAvailable();
  var saveTimer = null;

  /* stop the browser from navigating to the file if it's dropped even slightly outside a dropzone */
  ["dragover","drop"].forEach(function(evt){
    window.addEventListener(evt, function(e){ e.preventDefault(); });
  });

  function storageGet(key){
    if (useNativeStorage) return window.storage.get(key, false);
    try {
      var v = localStorage.getItem(LOCAL_PREFIX + key);
      return Promise.resolve(v == null ? null : { key: key, value: v, shared: false });
    } catch(e){ return Promise.reject(e); }
  }
  function storageSet(key, value){
    if (useNativeStorage) return window.storage.set(key, value, false);
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
      return Promise.resolve({ key: key, value: value, shared: false });
    } catch(e){ return Promise.reject(e); }
  }

  var SECTIONS = {
    products:   { title:"Товары",    icon:"🛒", loaded:false, order:[], raw:null, work:{}, currentId:null },
    categories: { title:"Категории", icon:"🗂️", loaded:false, order:[], raw:null, work:{}, currentId:null },
    messages:   { title:"Интерфейс", icon:"🌐", loaded:false, order:[], raw:{ru:null,kk:null,en:null}, work:{}, currentId:null }
  };
  var activeSection = "products";
  var enEnabled = true;
  storageGet("settings:enEnabled").then(function(res){
    if (res && res.value === "0"){ enEnabled = false; document.getElementById("enToggle").checked = false; renderAll(); }
  }).catch(function(){});
  document.getElementById("enToggle").addEventListener("change", function(e){
    enEnabled = e.target.checked;
    storageSet("settings:enEnabled", enEnabled ? "1" : "0").catch(function(){});
    renderAll();
  });

  /* ---------------- generic helpers ---------------- */
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function isLangObj(v){ return v && typeof v === "object" && !Array.isArray(v) && ("ru" in v || "kk" in v || "en" in v); }
  function asLangObj(v){
    if (isLangObj(v)) return { ru: v.ru || "", kk: v.kk || "", en: v.en || "", reviewed:false };
    if (typeof v === "string") return { ru: v, kk: "", en: "", reviewed:false };
    return { ru: "", kk: "", en: "", reviewed:false };
  }
  function cloneLang(o){ return { ru:o.ru||"", kk:o.kk||"", en:o.en||"" }; }
  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
  function setPath(obj, path, value){
    var cur = obj;
    for (var i=0;i<path.length-1;i++){
      var k = path[i];
      if (typeof cur[k] !== "object" || cur[k] === null) cur[k] = {};
      cur = cur[k];
    }
    cur[path[path.length-1]] = value;
  }
  function readFileAsJson(file){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(e){ try{ resolve(JSON.parse(e.target.result)); } catch(err){ reject(new Error('Файл "'+file.name+'" — некорректный JSON.')); } };
      r.onerror = function(){ reject(new Error('Не удалось прочитать файл "'+file.name+'".')); };
      r.readAsText(file, "utf-8");
    });
  }
  function downloadJson(obj, filename){
    var blob = new Blob([JSON.stringify(obj, null, "\t")], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function flash(text){
    var el = document.getElementById("saveIndicator");
    document.getElementById("saveIndicatorText").textContent = text;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove("show"); }, 1400);
  }

  /* ---------------- storage ---------------- */
  function loadFromStorage(sectionId, id){
    if (!storageOk) return Promise.resolve(null);
    return storageGet(sectionId+":"+id).then(function(res){
      if (!res || !res.value) return null;
      try { return JSON.parse(res.value); } catch(e){ return null; }
    }).catch(function(){ return null; });
  }
  function serializeForStorage(sectionId, work){
    if (sectionId === "products"){
      return {
        title:{ru:work.title.ru,kk:work.title.kk,en:work.title.en,reviewed:work.title.reviewed},
        short_description:{ru:work.short_description.ru,kk:work.short_description.kk,en:work.short_description.en,reviewed:work.short_description.reviewed},
        description:{ru:work.description.ru,kk:work.description.kk,en:work.description.en,reviewed:work.description.reviewed},
        additional_information: work.additional_information.map(function(it){
          return { title:{ru:it.title.ru,kk:it.title.kk,en:it.title.en,reviewed:it.title.reviewed}, value:{ru:it.value.ru,kk:it.value.kk,en:it.value.en,reviewed:it.value.reviewed} };
        })
      };
    }
    if (sectionId === "categories"){
      var subs = {};
      work.subKeys.forEach(function(sk){ subs[sk] = {ru:work.subs[sk].ru,kk:work.subs[sk].kk,en:work.subs[sk].en,reviewed:work.subs[sk].reviewed}; });
      return { title:{ru:work.title.ru,kk:work.title.kk,en:work.title.en,reviewed:work.title.reviewed}, subs:subs };
    }
    return { fields: work.fields.map(function(f){ return {path:f.path, ru:f.ru, kk:f.kk, en:f.en, reviewed:f.reviewed}; }) };
  }
  function saveToStorage(sectionId, id){
    if (!storageOk){ flash("Автосохранение недоступно — не забудьте скачать файл"); return; }
    var payload = serializeForStorage(sectionId, SECTIONS[sectionId].work[id]);
    storageSet(sectionId+":"+id, JSON.stringify(payload))
      .then(function(){ flash("Сохранено"); })
      .catch(function(){ flash("Не удалось сохранить"); });
  }
  function scheduleSave(sectionId, id){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveToStorage(sectionId, id); }, 500);
  }

  function mergeProductsStorage(work, saved){
    if (!saved) return;
    ["title","short_description","description"].forEach(function(f){
      if (saved[f]){
        if (typeof saved[f].ru === "string") work[f].ru = saved[f].ru;
        work[f].kk = work[f].kk || saved[f].kk || "";
        work[f].en = work[f].en || saved[f].en || "";
        work[f].reviewed = work[f].reviewed || !!saved[f].reviewed;
      }
    });
    if (Array.isArray(saved.additional_information)){
      work.additional_information.forEach(function(item, i){
        var s = saved.additional_information[i];
        if (!s) return;
        ["title","value"].forEach(function(sub){
          if (s[sub]){
            if (typeof s[sub].ru === "string") item[sub].ru = s[sub].ru;
            item[sub].kk = item[sub].kk || s[sub].kk || "";
            item[sub].en = item[sub].en || s[sub].en || "";
            item[sub].reviewed = item[sub].reviewed || !!s[sub].reviewed;
          }
        });
      });
    }
  }
  function mergeCategoriesStorage(work, saved){
    if (!saved) return;
    if (saved.title){
      if (typeof saved.title.ru === "string") work.title.ru = saved.title.ru;
      work.title.kk = work.title.kk || saved.title.kk || "";
      work.title.en = work.title.en || saved.title.en || "";
      work.title.reviewed = work.title.reviewed || !!saved.title.reviewed;
    }
    if (saved.subs){
      work.subKeys.forEach(function(sk){
        var s = saved.subs[sk];
        if (!s) return;
        if (typeof s.ru === "string") work.subs[sk].ru = s.ru;
        work.subs[sk].kk = work.subs[sk].kk || s.kk || "";
        work.subs[sk].en = work.subs[sk].en || s.en || "";
        work.subs[sk].reviewed = work.subs[sk].reviewed || !!s.reviewed;
      });
    }
  }
  function mergeMessagesStorage(work, saved){
    if (!saved || !Array.isArray(saved.fields)) return;
    work.fields.forEach(function(f){
      var key = f.path.join(".");
      var match = saved.fields.find(function(s){ return (s.path||[]).join(".") === key; });
      if (match){
        if (typeof match.ru === "string") f.ru = match.ru;
        f.kk = f.kk || match.kk || "";
        f.en = f.en || match.en || "";
        f.reviewed = f.reviewed || !!match.reviewed;
      }
    });
  }

  /* ---------------- builders ---------------- */
  var PRODUCT_TOP_FIELDS = ["title","short_description","description"];

  function buildProductsWork(entry){
    var w = { title: asLangObj(entry.title), short_description: asLangObj(entry.short_description), description: asLangObj(entry.description), additional_information: [] };
    var ai = Array.isArray(entry.additional_information) ? entry.additional_information : [];
    ai.forEach(function(item){
      w.additional_information.push({ title: asLangObj(item && item.title), value: asLangObj(item && item.value) });
    });
    var rest = {};
    for (var k in entry){ if (PRODUCT_TOP_FIELDS.indexOf(k) === -1 && k !== "additional_information") rest[k] = entry[k]; }
    w._rest = rest;
    return w;
  }

  function buildCategoriesWork(entry){
    var w = { title: asLangObj(entry.title), subKeys: [], subs: {}, _rest: {} };
    for (var k in entry){ if (k !== "title" && k !== "categories") w._rest[k] = entry[k]; }
    if (entry.categories && typeof entry.categories === "object"){
      Object.keys(entry.categories).forEach(function(sk){
        if (sk === "//") return;
        w.subKeys.push(sk);
        w.subs[sk] = asLangObj(entry.categories[sk] && entry.categories[sk].title);
      });
    }
    return w;
  }

  function flattenLeaves(ruNode, kkNode, enNode, prefix, out){
    if (!ruNode || typeof ruNode !== "object") return;
    Object.keys(ruNode).forEach(function(k){
      if (k === "//") return;
      var path = prefix.concat([k]);
      var ruVal = ruNode[k];
      if (ruVal !== null && typeof ruVal === "object" && !Array.isArray(ruVal)){
        flattenLeaves(ruVal, (kkNode && kkNode[k]) || {}, (enNode && enNode[k]) || {}, path, out);
      } else {
        out.push({
          path: path,
          label: path.join(" → "),
          ru: String(ruVal == null ? "" : ruVal),
          kk: (kkNode && typeof kkNode[k] === "string") ? kkNode[k] : "",
          en: (enNode && typeof enNode[k] === "string") ? enNode[k] : "",
          reviewed: false
        });
      }
    });
  }

  /* ---------------- progress ---------------- */
  function sectionSlots(sectionId, work){
    if (sectionId === "products"){
      var slots = [];
      PRODUCT_TOP_FIELDS.forEach(function(f){ if ((work[f].ru||"").trim()) slots.push(work[f]); });
      work.additional_information.forEach(function(it){
        if ((it.title.ru||"").trim()) slots.push(it.title);
        if ((it.value.ru||"").trim()) slots.push(it.value);
      });
      return slots;
    }
    if (sectionId === "categories"){
      var s = [];
      if ((work.title.ru||"").trim()) s.push(work.title);
      work.subKeys.forEach(function(sk){ if ((work.subs[sk].ru||"").trim()) s.push(work.subs[sk]); });
      return s;
    }
    return work.fields.filter(function(f){ return (f.ru||"").trim() !== ""; });
  }
  function recordProgress(sectionId, work){
    var slots = sectionSlots(sectionId, work);
    if (!slots.length) return { translated:1, reviewed:1, total:0 };
    var filled=0, reviewed=0;
    slots.forEach(function(s){
      if ((s.kk||"").trim() && (!enEnabled || (s.en||"").trim())) filled++;
      if (s.reviewed) reviewed++;
    });
    return { translated: filled/slots.length, reviewed: reviewed/slots.length, total: slots.length };
  }
  function recordLabel(sectionId, id, work){
    if (sectionId === "products" || sectionId === "categories") return work.title.ru || "(без названия)";
    return id;
  }

  /* ---------------- init per section ---------------- */
  function initSectionProducts(data){
    var sec = SECTIONS.products;
    sec.raw = data;
    sec.order = Object.keys(data).filter(function(k){ return k !== "//"; });
    sec.work = {};
    var tasks = sec.order.map(function(id){
      sec.work[id] = buildProductsWork(data[id]);
      return loadFromStorage("products", id).then(function(saved){ mergeProductsStorage(sec.work[id], saved); });
    });
    return Promise.all(tasks).then(function(){
      sec.loaded = true; sec.currentId = null;
      populateCategoryFilter();
    });
  }
  function initSectionCategories(data){
    var sec = SECTIONS.categories;
    sec.raw = data;
    sec.order = Object.keys(data).filter(function(k){ return k !== "//"; });
    sec.work = {};
    var tasks = sec.order.map(function(id){
      sec.work[id] = buildCategoriesWork(data[id]);
      return loadFromStorage("categories", id).then(function(saved){ mergeCategoriesStorage(sec.work[id], saved); });
    });
    return Promise.all(tasks).then(function(){ sec.loaded = true; sec.currentId = null; });
  }
  function initSectionMessages(ruObj, kkObj, enObj){
    var sec = SECTIONS.messages;
    sec.raw = { ru: ruObj, kk: kkObj || {}, en: enObj || {} };
    sec.order = Object.keys(ruObj).filter(function(k){ return k !== "//"; });
    sec.work = {};
    var tasks = sec.order.map(function(ns){
      var fields = [];
      flattenLeaves(ruObj[ns], (kkObj && kkObj[ns]) || {}, (enObj && enObj[ns]) || {}, [], fields);
      sec.work[ns] = { label: ns, fields: fields };
      return loadFromStorage("messages", ns).then(function(saved){ mergeMessagesStorage(sec.work[ns], saved); });
    });
    return Promise.all(tasks).then(function(){ sec.loaded = true; sec.currentId = null; });
  }

  function wireSingleDropzone(dzId, inputId, errId, initFn){
    var dz = document.getElementById(dzId);
    var input = document.getElementById(inputId);
    var errEl = document.getElementById(errId);
    var dragDepth = 0;
    input.addEventListener("change", function(e){ if (e.target.files[0]) handle(e.target.files[0]); });
    dz.addEventListener("dragenter", function(e){ e.preventDefault(); dragDepth++; dz.classList.add("drag"); });
    dz.addEventListener("dragover", function(e){ e.preventDefault(); });
    dz.addEventListener("dragleave", function(e){
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dz.classList.remove("drag");
    });
    dz.addEventListener("drop", function(e){
      e.preventDefault(); dragDepth = 0; dz.classList.remove("drag");
      if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);
    });
    function handle(file){
      errEl.style.display = "none";
      readFileAsJson(file).then(initFn).then(function(){ renderAll(); }).catch(function(err){
        errEl.textContent = err.message; errEl.style.display = "block";
      });
    }
  }

  function wireTripleUpload(){
    var files = { ru:null, kk:null, en:null };
    ["ru","kk","en"].forEach(function(lang){
      document.getElementById("fi-msg-"+lang).addEventListener("change", function(e){
        var f = e.target.files[0];
        files[lang] = f || null;
        document.getElementById("name-"+lang).textContent = f ? f.name : (lang==="ru" ? "файл не выбран" : "необязательно");
        document.getElementById("btnLoadMessages").disabled = !files.ru;
      });
    });
    document.getElementById("btnLoadMessages").addEventListener("click", function(){
      var errEl = document.getElementById("err-messages");
      errEl.style.display = "none";
      if (!files.ru){ errEl.textContent = "Сначала выберите ru.json — он обязателен."; errEl.style.display="block"; return; }
      Promise.all([
        readFileAsJson(files.ru),
        files.kk ? readFileAsJson(files.kk) : Promise.resolve({}),
        files.en ? readFileAsJson(files.en) : Promise.resolve({})
      ]).then(function(res){
        return initSectionMessages(res[0], res[1], res[2]);
      }).then(function(){ renderAll(); }).catch(function(err){
        errEl.textContent = err.message; errEl.style.display = "block";
      });
    });
  }

  /* ---------------- sidebar ---------------- */
  var searchInput = document.getElementById("searchInput");
  var categoryFilter = document.getElementById("categoryFilter");
  var onlyUnfinished = document.getElementById("onlyUnfinished");
  searchInput.addEventListener("input", renderSidebar);
  categoryFilter.addEventListener("change", renderSidebar);
  onlyUnfinished.addEventListener("change", renderSidebar);

  function matchesFilters(sectionId, id){
    var sec = SECTIONS[sectionId];
    var work = sec.work[id];
    var q = searchInput.value.trim().toLowerCase();
    if (q){
      var label = recordLabel(sectionId, id, work).toLowerCase();
      if (label.indexOf(q) === -1 && String(id).toLowerCase().indexOf(q) === -1) return false;
    }
    if (sectionId === "products"){
      var cat = categoryFilter.value;
      if (cat){
        var cs = Array.isArray(sec.raw[id].category) ? sec.raw[id].category : [];
        if (cs.indexOf(cat) === -1) return false;
      }
    }
    if (onlyUnfinished.checked){
      var p = recordProgress(sectionId, work);
      if (p.total === 0 || p.reviewed >= 1) return false;
    }
    return true;
  }
  function visibleList(){ return SECTIONS[activeSection].order.filter(function(id){ return matchesFilters(activeSection, id); }); }

  function renderSidebar(){
    var sec = SECTIONS[activeSection];
    var visible = visibleList();
    var list = document.getElementById("sidebarList");
    list.innerHTML = "";
    visible.forEach(function(id){
      var work = sec.work[id];
      var prog = recordProgress(activeSection, work);
      var dotClass = prog.total === 0 ? "done" : (prog.reviewed >= 1 ? "done" : ((prog.translated > 0 || prog.reviewed > 0) ? "partial" : ""));
      var row = document.createElement("div");
      row.className = "prod-item" + (id === sec.currentId ? " active" : "");
      row.innerHTML = '<span class="prod-dot ' + dotClass + '"></span>' +
        '<span class="prod-name">' + escapeHtml(recordLabel(activeSection, id, work)) + "</span>" +
        '<span class="prod-id">' + escapeHtml(String(id)) + "</span>";
      row.addEventListener("click", function(){ sec.currentId = id; renderAll(); });
      list.appendChild(row);
    });
    document.getElementById("sidebarCount").textContent = visible.length + " из " + sec.order.length;
  }
  function refreshSidebarDot(id){
    var list = visibleList();
    var idx = list.indexOf(id);
    var rows = document.getElementById("sidebarList").querySelectorAll(".prod-item");
    if (idx > -1 && rows[idx]){
      var prog = recordProgress(activeSection, SECTIONS[activeSection].work[id]);
      var dotClass = prog.total === 0 ? "done" : (prog.reviewed >= 1 ? "done" : ((prog.translated > 0 || prog.reviewed > 0) ? "partial" : ""));
      rows[idx].querySelector(".prod-dot").className = "prod-dot " + dotClass;

  function renderLangField(parent, label, hint, langObj, multiline, onEdit, placeholderNote){
    var box = document.createElement("div");
    box.className = "field-block" + (langObj.reviewed ? " is-reviewed" : "");
    var enBlock = enEnabled ?
      ('<div class="lang-col"><label>🇬🇧 English</label><textarea class="' + (multiline?"big":"") + '" data-lang="en" placeholder="нет текста для перевода"></textarea></div>') : "";
    box.innerHTML =
      "<h3>" + label + "</h3>" +
      (hint ? '<div class="field-hint">' + hint + "</div>" : "") +
      (placeholderNote ? '<div class="field-hint" style="color:var(--plum)">' + placeholderNote + "</div>" : "") +
      '<div class="lang-col"><label>🇷🇺 Русский</label><textarea class="ru-edit ' + (multiline?"big":"") + '" data-lang="ru" placeholder="— пусто —"></textarea></div>' +
      '<div class="lang-grid' + (enEnabled ? "" : " single") + '">' +
        '<div class="lang-col"><label>🇰🇿 Казахский</label><textarea class="' + (multiline?"big":"") + '" data-lang="kk" placeholder="нет текста для перевода"></textarea></div>' +
        enBlock +
      "</div>" +
      '<label class="reviewed-row"><input type="checkbox" data-role="reviewed"/> ✓ Перевод проверен</label>';
    var ruTa = box.querySelector('[data-lang="ru"]');
    var kkTa = box.querySelector('[data-lang="kk"]');
    var enTa = box.querySelector('[data-lang="en"]');
    ruTa.value = langObj.ru; kkTa.value = langObj.kk; if (enTa) enTa.value = langObj.en;
    var revCb = box.querySelector('[data-role="reviewed"]');
    function sync(){
      var hasRu = !!(langObj.ru || "").trim();
      kkTa.disabled = !hasRu;
      if (enTa) enTa.disabled = !hasRu;
      var ready = hasRu && (langObj.kk||"").trim() && (!enEnabled || (langObj.en||"").trim());
      revCb.disabled = !ready;
      if (!ready && langObj.reviewed) langObj.reviewed = false;
      revCb.checked = !!langObj.reviewed;
      box.classList.toggle("is-reviewed", !!langObj.reviewed);
    }
    revCb.addEventListener("change", function(){ langObj.reviewed = revCb.checked; sync(); onEdit(); });
    ruTa.addEventListener("input", function(){ langObj.ru = ruTa.value; sync(); onEdit(); });
    kkTa.addEventListener("input", function(){ langObj.kk = kkTa.value; sync(); onEdit(); });
    if (enTa) enTa.addEventListener("input", function(){ langObj.en = enTa.value; sync(); onEdit(); });
    sync();
    parent.appendChild(box);
  }

  function onFieldEdit(){
    scheduleSave(activeSection, SECTIONS[activeSection].currentId);
    refreshSidebarDot(SECTIONS[activeSection].currentId);
    updateGlobalProgress();
  }

  function markAllReviewed(sectionId, work){
    sectionSlots(sectionId, work).forEach(function(s){
      if ((s.kk||"").trim() && (!enEnabled || (s.en||"").trim())) s.reviewed = true;
    });
  }

  /* ---------------- per-section editors ---------------- */
  function navButtonsHtml(){
    return '<div class="nav-btns">' +
      '<button class="btn btn-outline btn-sm" id="btnMarkAll">Отметить всё проверенным</button>' +
      '<button class="btn btn-outline btn-sm" id="btnPrev">← Назад</button>' +
      '<button class="btn btn-outline btn-sm" id="btnNext">Далее →</button>' +
      "</div>";
  }
  function wireNav(container, id){
    var mark = container.querySelector("#btnMarkAll");
    if (mark) mark.addEventListener("click", function(){
      markAllReviewed(activeSection, SECTIONS[activeSection].work[id]);
      renderAll();
      scheduleSave(activeSection, id);
    });
    var prev = container.querySelector("#btnPrev");
    if (prev) prev.addEventListener("click", function(){ stepRecord(-1); });
    var next = container.querySelector("#btnNext");
    if (next) next.addEventListener("click", function(){ stepRecord(1); });
  }
  function stepRecord(dir){
    var list = visibleList();
    var idx = list.indexOf(SECTIONS[activeSection].currentId);
    var next = list[idx + dir];
    if (next){ SECTIONS[activeSection].currentId = next; renderAll(); }
  }

  function renderProductEditor(main, sec, id){
    var work = sec.work[id];
    var entry = sec.raw[id];
    var catStr = Array.isArray(entry.category) ? entry.category.join(", ") : "—";
    var head = document.createElement("div");
    head.innerHTML = '<div class="prod-head"><div><h2>' + escapeHtml(work.title.ru || "(без названия)") + "</h2>" +
      '<div class="prod-meta"><span>Артикул: ' + id + "</span><span>Категория: " + escapeHtml(catStr) + "</span></div></div>" +
      navButtonsHtml() + "</div>";
    main.appendChild(head);
    wireNav(head, id);

    renderLangField(main, "Название (title)", "", work.title, false, onFieldEdit);
    renderLangField(main, "Краткое описание (short_description)", "Показывается на карточке товара в каталоге.", work.short_description, false, onFieldEdit);
    renderLangField(main, "Описание (description)", "Показывается на странице товара. Переносы строк сохраняются.", work.description, true, onFieldEdit);

    if (work.additional_information.length){
      var h = document.createElement("div");
      h.className = "subhead";
      h.textContent = "Дополнительная информация";
      main.appendChild(h);
      work.additional_information.forEach(function(item, i){
        renderLangField(main, "Доп. поле " + (i+1) + " — название", "Например «Вес»", item.title, false, onFieldEdit);
        renderLangField(main, "Доп. поле " + (i+1) + " — значение", "Например «0.310 kg»", item.value, false, onFieldEdit);
      });
    }
    appendBottomNav(main, id);
  }

  function renderCategoryEditor(main, sec, id){
    var work = sec.work[id];
    var head = document.createElement("div");
    head.innerHTML = '<div class="prod-head"><div><h2>' + escapeHtml(work.title.ru || "(без названия)") + "</h2>" +
      '<div class="prod-meta"><span>Ключ категории: ' + escapeHtml(id) + "</span></div></div>" +
      navButtonsHtml() + "</div>";
    main.appendChild(head);
    wireNav(head, id);

    renderLangField(main, "Название категории", "", work.title, false, onFieldEdit);
    if (work.subKeys.length){
      var h = document.createElement("div");
      h.className = "subhead";
      h.textContent = "Подкатегории";
      main.appendChild(h);
      work.subKeys.forEach(function(sk){
        renderLangField(main, "Подкатегория: " + escapeHtml(sk), "", work.subs[sk], false, onFieldEdit);
      });
    }
    appendBottomNav(main, id);
  }

  function renderMessagesEditor(main, sec, id){
    var work = sec.work[id];
    var head = document.createElement("div");
    head.innerHTML = '<div class="prod-head"><div><h2>' + escapeHtml(id) + "</h2>" +
      '<div class="prod-meta"><span>' + work.fields.length + " строк(и) текста интерфейса</span></div></div>" +
      navButtonsHtml() + "</div>";
    main.appendChild(head);
    wireNav(head, id);

    work.fields.forEach(function(f){
      var matches = (f.ru||"").match(/\{[^}]+\}/g);
      var note = matches ? ("Не переводите и не удаляйте: " + matches.join(", ")) : null;
      renderLangField(main, f.label, '<span class="mono">' + escapeHtml(f.path.join(".")) + "</span>", f, f.ru.length > 60, onFieldEdit, note);
    });
    appendBottomNav(main, id);
  }

  function appendBottomNav(main, id){
    var bottom = document.createElement("div");
    bottom.className = "bottom-nav";
    bottom.innerHTML = '<button class="btn btn-outline" id="btnPrev2">← Предыдущий</button><button class="btn btn-outline" id="btnNext2">Следующий →</button>';
    main.appendChild(bottom);
    bottom.querySelector("#btnPrev2").addEventListener("click", function(){ stepRecord(-1); });
    bottom.querySelector("#btnNext2").addEventListener("click", function(){ stepRecord(1); });
  }

  function renderEditor(){
    var sec = SECTIONS[activeSection];
    var main = document.getElementById("mainInner");
    main.innerHTML = "";
    var id = sec.currentId;
    if (!id){ main.innerHTML = '<div class="empty-state">Ничего не найдено — измените фильтры слева.</div>'; return; }
    if (activeSection === "products") renderProductEditor(main, sec, id);
    else if (activeSection === "categories") renderCategoryEditor(main, sec, id);
    else renderMessagesEditor(main, sec, id);
    main.scrollTop = 0;
  }

  /* ---------------- global progress ---------------- */
  function updateGlobalProgress(){
    var sec = SECTIONS[activeSection];
    var total = sec.order.length;
    var reviewedDone = sec.order.filter(function(id){ return recordProgress(activeSection, sec.work[id]).reviewed >= 1; }).length;
    var translatedDone = sec.order.filter(function(id){ return recordProgress(activeSection, sec.work[id]).translated >= 1; }).length;
    document.getElementById("progressReviewed").textContent = reviewedDone + "/" + total;
    var waiting = translatedDone - reviewedDone;
    document.getElementById("progressTranslated").textContent = waiting > 0 ? (waiting + " переведено, ждут проверки") : "";
    renderTabs();
  }

  /* ---------------- export ---------------- */
  document.getElementById("btnExport").addEventListener("click", function(){
    if (activeSection === "products") exportProducts();
    else if (activeSection === "categories") exportCategories();
    else exportMessages();
  });
  function exportProducts(){
    var sec = SECTIONS.products;
    var out = {};
    if (sec.raw["//"]) out["//"] = sec.raw["//"];
    sec.order.forEach(function(id){
      var w = sec.work[id];
      var o = {};
      o.title = cloneLang(w.title);
      o.short_description = cloneLang(w.short_description);
      o.description = cloneLang(w.description);
      o.additional_information = w.additional_information.map(function(it){ return { title: cloneLang(it.title), value: cloneLang(it.value) }; });
      for (var k in w._rest) o[k] = w._rest[k];
      out[id] = o;
    });
    downloadJson(out, "products.json");
    flash("products.json скачан ✓");
  }
  function exportCategories(){
    var sec = SECTIONS.categories;
    var out = {};
    if (sec.raw["//"]) out["//"] = sec.raw["//"];
    sec.order.forEach(function(id){
      var w = sec.work[id];
      var o = {};
      o.title = cloneLang(w.title);
      if (w.subKeys.length){
        o.categories = {};
        w.subKeys.forEach(function(sk){ o.categories[sk] = { title: cloneLang(w.subs[sk]) }; });
      }
      for (var k in w._rest) o[k] = w._rest[k];
      out[id] = o;
    });
    downloadJson(out, "categories.json");
    flash("categories.json скачан ✓");
  }
  function exportMessages(){
    var sec = SECTIONS.messages;
    var ruOut = deepClone(sec.raw.ru);
    var kkOut = deepClone(sec.raw.ru);
    sec.order.forEach(function(ns){
      sec.work[ns].fields.forEach(function(f){
        setPath(kkOut[ns], f.path, f.kk || "");
      });
    });
    downloadJson(ruOut, "ru.json");
    setTimeout(function(){ downloadJson(kkOut, "kk.json"); }, 300);
    if (enEnabled){
      var enOut = deepClone(sec.raw.ru);
      sec.order.forEach(function(ns){
        sec.work[ns].fields.forEach(function(f){ setPath(enOut[ns], f.path, f.en || ""); });
      });
      setTimeout(function(){ downloadJson(enOut, "en.json"); }, 600);
    }
    flash("Файлы скачиваются…");
  }

  /* ---------------- reload ---------------- */
  document.getElementById("btnReload").addEventListener("click", function(){
    if (!confirm("Загрузить другой файл для «" + SECTIONS[activeSection].title + "»? Уже введённые переводы сохранены в браузере и не потеряются.")) return;
    SECTIONS[activeSection].loaded = false;
    SECTIONS[activeSection].currentId = null;
    renderAll();
  });

  /* ---------------- master render ---------------- */
  function renderAll(){
    renderTabs();
    var sec = SECTIONS[activeSection];
    if (sec.loaded){
      uploadArea.classList.remove("show");
      document.getElementById("workArea").classList.add("active");
      document.getElementById("categoryFilterWrap").style.display = activeSection === "products" ? "block" : "none";
      document.getElementById("progressPill").style.display = "flex";
      document.getElementById("btnReload").style.display = "inline-flex";
      document.getElementById("btnExport").style.display = "inline-flex";
      document.getElementById("btnExport").textContent = exportLabel();
      if (!sec.currentId){
        var list = visibleList();
        sec.currentId = list[0] || sec.order[0] || null;
      }
      renderSidebar();
      renderEditor();
      updateGlobalProgress();
    } else {
      document.getElementById("workArea").classList.remove("active");
      document.getElementById("progressPill").style.display = "none";
      document.getElementById("btnReload").style.display = "none";
      document.getElementById("btnExport").style.display = "none";
      renderUploadArea();
    }
  }

  /* ---------------- embedded data (pre-baked into this file) ---------------- */
  function readEmbedded(id){
    var el = document.getElementById(id);
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch(e){ return null; }
  }
  function autoLoadEmbedded(){
    var tasks = [];
    var productsData = readEmbedded("embedded-products");
    var categoriesData = readEmbedded("embedded-categories");
    var ruData = readEmbedded("embedded-ru");
    var kkData = readEmbedded("embedded-kk");
    var enData = readEmbedded("embedded-en");
    if (productsData) tasks.push(initSectionProducts(productsData));
    if (categoriesData) tasks.push(initSectionCategories(categoriesData));
    if (ruData) tasks.push(initSectionMessages(ruData, kkData, enData));
    return Promise.all(tasks);
  }

  autoLoadEmbedded().then(renderAll).catch(function(){ renderAll(); });
})();
</script>
</body>
</html>
